---
- name: Delete SGs within VPC
  hosts: localhost
  gather_facts: no

  vars:
    vpc_name: "windows_domain"
    region: "eu-west-2"
    public_subnet_cidr: "10.200.1.0/24"
    private_subnet_cidr: "10.200.2.0/24"

  tasks:
    - name: Fetch VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
      register: vpcs_info

    - name: Get VPC ID for "windows_domain"
      set_fact:
        vpc_id: "{{ item.vpc_id }}"
      loop: "{{ vpcs_info.vpcs }}"
      when: (item.tags.Name | default('No Name')) == 'windows_domain'
    
    - name: Delete "Allow SSH" SG
      ec2_group:
        name: Allow SSH
        description: Allows SSH from anywhere
        vpc_id: "{{ vpc_id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            ports: 22
            cidr_ip: '0.0.0.0/0'
        state: absent
      register: public_subnet
