---
- name: Create Linux EC2 VM
  hosts: localhost
  gather_facts: no

  vars:
    vpc_name: "windows_domain"
    region: "eu-west-2"
    ec2_key_directory: "./"

  tasks:
    - name: Fetch VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
      register: vpcs_info

    - name: Get VPC ID for "windows_domain"
      set_fact:
        vpc_id: "{{ item.vpc_id }}"
      loop: "{{ vpcs_info.vpcs }}"
      when: (item.tags.Name | default('No Name')) == 'windows_domain'

    - name: Fetch Subnet information
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          vpc-id: "{{ vpc_id }}"
      register: subnets_info

    - name: Find Public Subnet
      set_fact:
        pub_subnet_id: "{{ item.subnet_id }}"
      loop: "{{ subnets_info.subnets }}"
      when: item.tags.Name == "Public_Subnet"

    - name: Fetch SG information
      amazon.aws.ec2_security_group_info:
        filters:
          vpc_id: "{{ vpc_id }}"
      register: sg_info

    - name: Get SG ID for Allow SSH
      set_fact:
        sg_ssh_id: "{{ item.group_id }}"
      loop: "{{ sg_info.security_groups }}"
      when: item.group_name == "Allow SSH"

    - name: Get SG ID for Allow OpenVPN
      set_fact:
        sg_ovpn_id: "{{ item.group_id }}"
      loop: "{{ sg_info.security_groups }}"
      when: item.group_name == "Allow OpenVPN"

    - name: Create EC2 server
      amazon.aws.ec2_instance:
        name: "vpn01"
        image_id: ami-0b9932f4918a00c4f
        wait: yes
        instance_type: t2.micro
        region: "{{ region }}"
        vpc_subnet_id: "{{ pub_subnet_id }}"
        security_groups: ["{{ sg_ssh_id }}","{{ sg_ovpn_id }}"]
        network:
          assign_public_ip: true
        key_name: windows_domain_keypair
        tags:
          Name: vpn01
          Role: vpn
