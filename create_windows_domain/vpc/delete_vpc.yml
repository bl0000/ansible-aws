- name: Delete VPC named "windows_domain"
  hosts: localhost
  gather_facts: no

  vars:
    aws_default_region: "eu-west-2"

  tasks:
    - name: Fetch VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_default_region }}"
      register: vpcs_info

    - name: Get VPC ID for "windows_domain"
      set_fact:
        vpc_id_to_delete: "{{ item.vpc_id }}"
      loop: "{{ vpcs_info.vpcs }}"
      when: (item.tags.Name | default('No Name')) == 'windows_domain'

    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        state: absent
        vpc_id: "{{ vpc_id_to_delete }}"
        region: "{{ aws_default_region }}"
      when: vpc_id_to_delete is defined

