---
- name: Create keypair
  hosts: localhost
  gather_facts: no

  vars:
    region: "eu-west-2"
    keypair_name: "windows_domain_keypair"

  tasks:
    - name: Create a new EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ keypair_name }}"
        region: "{{ region }}"
      register: keypair
      
    - copy: content="{{ keypair.key.private_key }}" dest=~/.ssh/{{ keypair_name }}.pem

    - name: Change file permissions
      ansible.builtin.file:
        path: "~/.ssh/{{ keypair_name }}.pem"
        mode: '600'
