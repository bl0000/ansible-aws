---
- name: Delete Subnets within VPC
  hosts: localhost
  gather_facts: no

  vars:
    vpc_name: "windows_domain"
    region: "eu-west-2"
    public_subnet_cidr: "10.200.1.0/24"
    private_subnet_cidr: "10.200.2.0/24"
  
  tasks:
    - name: Fetch VPC information
      amazon.aws.ec2_vpc_net_info:
      register: vpcs_info

    - name: Get VPC ID for "windows_domain"
      set_fact:
        vpc_id: "{{ item.vpc_id }}"
      loop: "{{ vpcs_info.vpcs }}"
      when: (item.tags.Name | default('No Name')) == 'windows_domain'

    - name: Find Public Subnet ID
      ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ public_subnet_cidr }}"
        region: "{{ region }}"
        state: present
        map_public: yes
        resource_tags:
          Name: "Public_Subnet"
      register: public_subnet

    - name: Find NAT GW ID
      ec2_vpc_nat_gateway:
        region: "{{ region }}"
        subnet_id: "{{ public_subnet.subnet.id }}"
        state: present
        tags:
          Name: "windomain_natgw"
        if_exist_do_not_create: true
      register: natgw
 
    - name: Delete NAT GW and release Elastic IP, wait for deletion
      ec2_vpc_nat_gateway:
        region: "{{ region }}"
        nat_gateway_id: "{{ natgw.nat_gateway_id }}"
        state: absent
        release_eip: true
        wait: true
        wait_timeout: 500

    - name: Delete public RT
      ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ region }}"
        state: absent
        tags:
          Name: "public_rt"

    - name: Delete private RT
      ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ region }}"
        state: absent
        tags:
          Name: "private_rt"

    - name: Delete IGW
      ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        region: "{{ region }}"
        state: absent
        tags:
          Name: "windomain_igw"
      register: igw

    - name: Delete Public Subnet
      ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ public_subnet_cidr }}"
        region: "{{ region }}"
        state: absent
        map_public: yes
        resource_tags:
          Name: "Public_Subnet"

    - name: Delete Private Subnet
      ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ private_subnet_cidr }}"
        region: "{{ region }}"
        state: absent
        map_public: no
        resource_tags:
          Name: "Private_Subnet"


