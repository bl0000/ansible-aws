- name: Get information about VPCs
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Fetch VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_default_region }}"
      register: vpcs_info

    - name: Print VPC names
      debug:
        msg: "{{ item.tags.Name | default('No Name') }}"
      loop: "{{ vpcs_info.vpcs }}"

    - name: Print VPC ID if name is "windows_domain"
      debug:
        msg: "{{ item.vpc_id }}"
      loop: "{{ vpcs_info.vpcs }}"
      when: (item.tags.Name | default('No Name')) == 'windows_domain'

