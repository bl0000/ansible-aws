---
- name: Create Windows Domain Controller (EC2 instance)
  hosts: localhost
  gather_facts: no

  vars:
    vpc_name: "windows_domain"
    region: "eu-west-2"

  tasks:
    - name: Fetch VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
      register: vpcs_info

    - name: Get VPC ID for "windows_domain"
      set_fact:
        vpc_id: "{{ item.vpc_id }}"
      loop: "{{ vpcs_info.vpcs }}"
      when: (item.tags.Name | default('No Name')) == 'windows_domain'

    - name: Fetch Subnet information
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          vpc-id: "{{ vpc_id }}"
      register: subnets_info

    - name: Find Private Subnet
      set_fact:
        priv_subnet_id: "{{ item.subnet_id }}"
      loop: "{{ subnets_info.subnets }}"
      when: item.tags.Name == "Public_Subnet"

    - name: Fetch SG information
      amazon.aws.ec2_security_group_info:
        filters:
          vpc_id: "{{ vpc_id }}"
      register: sg_info

    - name: Get SG ID for Allow RDP
      set_fact:
        sg_rdp_id: "{{ item.group_id }}"
      loop: "{{ sg_info.security_groups }}"
      when: item.group_name == "Allow RDP"

    - name: Create EC2 server
      amazon.aws.ec2_instance:
        name: "dc01"
        image_id: ami-04ae4ddfe3f32eb6e
        wait: yes
        instance_type: t2.small
        region: "{{ region }}"
        vpc_subnet_id: "{{ priv_subnet_id }}"
        security_group: "{{ sg_rdp_id }}"
        key_name: windows_domain_keypair
        tags:
          Name: dc01
          Role: domain_controller
